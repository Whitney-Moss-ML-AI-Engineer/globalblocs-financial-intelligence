version: "1.0"
purpose: "Pre-analysis registry of 20 proposed GlobalBLOCS macro-financial and firm-level hypotheses"
status: "specification_only_not_empirical_results"
governance:
  require_pre_registration: true
  require_source_lineage: true
  prohibit_lookahead_bias: true
  require_effect_size_and_confidence_interval: true
  causal_claim_requires_identification_argument: true
  multiple_testing_adjustment: "Holm or Benjamini-Hochberg within declared hypothesis family"
  missing_data_are_not_zero: true
hypotheses:
  - {id: H01, title: "Policy rates and equity returns", outcome: "broad equity-index log return", exposure: "identified monetary policy surprise", frequency: "daily/event", methods: ["event study", "local projections", "SVAR"], sources: ["FRED", "central banks", "CBOE"], identification: "high-frequency monetary surprise or defensible structural shock", main_threat: "policy endogeneity and central-bank information effects"}
  - {id: H02, title: "Inflation and real consumption", outcome: "real household consumption growth", exposure: "inflation surprise or inflation rate", frequency: "quarterly/annual", methods: ["panel FE", "ARDL/ECM", "local projections"], sources: ["WDI", "IMF", "OECD", "FRED"], identification: "defensible exogenous supply shock if causal effect is claimed", main_threat: "income and inflation jointly respond to macro shocks"}
  - {id: H03, title: "Output growth and unemployment", outcome: "change in unemployment rate", exposure: "real GDP growth", frequency: "quarterly/annual", methods: ["panel FE", "country-specific Okun regressions", "VAR"], sources: ["ILOSTAT", "WDI", "OECD", "IMF"], identification: "primarily descriptive/dynamic unless a shock design is defended", main_threat: "labor supply, productivity and common shocks"}
  - {id: H04, title: "Sovereign debt and currency value", outcome: "FX log return with quote convention documented", exposure: "lagged debt/GDP", frequency: "quarterly/annual", methods: ["panel FE", "event study", "IV if valid"], sources: ["IMF WEO/IFS", "BIS", "WDI"], identification: "credible external instrument or well-defined sovereign-risk event", main_threat: "fiscal policy endogeneity and regime heterogeneity"}
  - {id: H05, title: "FDI and long-run growth", outcome: "real GDP-per-capita or productivity growth", exposure: "FDI inflow/GDP", frequency: "annual", methods: ["panel FE", "local projections", "growth regression"], sources: ["WDI", "OECD", "IMF", "Penn World Table"], identification: "credible exogenous FDI variation or explicitly associational design", main_threat: "FDI selection into high-growth economies"}
  - {id: H06, title: "Gold and market stress", outcome: "gold return and conditional volatility", exposure: "VIX/realized volatility", frequency: "daily", methods: ["OLS with robust inference", "quantile regression", "GARCH/EGARCH"], sources: ["FRED", "World Bank commodity data", "licensed market data"], identification: "time-series association/event windows; no automatic causal interpretation", main_threat: "common shocks, currency and real-yield effects"}
  - {id: H07, title: "Exchange rates and exports", outcome: "real export volume", exposure: "real effective exchange rate change", frequency: "quarterly/annual", methods: ["ARDL/ECM", "gravity PPML"], sources: ["UN Comtrade", "WDI", "BIS", "WTO"], identification: "credible trade/terms-of-trade shock if causal", main_threat: "simultaneous trade and FX determination"}
  - {id: H08, title: "Quantum R&D and firm performance", outcome: "future valuation, innovation or abnormal return", exposure: "documented quantum R&D intensity", frequency: "firm-year/event", methods: ["firm FE", "event study", "DiD if defensible"], sources: ["SEC EDGAR", "USPTO", "EPO/PATSTAT", "issuer reports"], identification: "credible comparison group or plausibly exogenous treatment", main_threat: "proxy error and innovative-firm selection"}
  - {id: H09, title: "ESG and firm valuation", outcome: "market value, Tobin's Q or price-to-book", exposure: "lagged provider-specific ESG score", frequency: "firm-year", methods: ["firm FE", "DiD around disclosure rules"], sources: ["SEC EDGAR", "issuer reports", "licensed ESG data"], identification: "credible regulatory variation if causal", main_threat: "provider disagreement and omitted firm quality"}
  - {id: H10, title: "CBDC and bank deposits", outcome: "bank deposits or deposit share", exposure: "CBDC rollout/exposure status", frequency: "quarterly/annual", methods: ["staggered DiD", "synthetic control"], sources: ["central banks", "BIS", "IMF"], identification: "credible comparison and treatment-timing assumptions", main_threat: "selection into CBDC rollout and simultaneous banking reforms"}
  - {id: H11, title: "AI adoption and bank profitability", outcome: "ROA, ROE, margins or productivity", exposure: "documented AI adoption proxy", frequency: "firm-year/event", methods: ["firm FE", "event study", "DiD if defensible"], sources: ["SEC filings", "annual reports", "patent databases"], identification: "credible treatment variation and comparison group", main_threat: "adoption proxy error and firm selection"}
  - {id: H12, title: "Pension fund size and risk", outcome: "portfolio volatility or downside risk", exposure: "lagged log AUM", frequency: "fund-period", methods: ["fund FE", "allocation-adjusted regression"], sources: ["OECD", "audited fund reports", "public disclosures"], identification: "associational unless exogenous AUM shock is defended", main_threat: "asset-allocation differences and return smoothing"}
  - {id: H13, title: "Sanctions and bilateral trade", outcome: "bilateral product-level trade value/quantity", exposure: "sanction dyad/product/time indicator or intensity", frequency: "monthly/annual", methods: ["gravity PPML", "event study/DiD"], sources: ["UN Comtrade", "WTO", "official sanctions lists"], identification: "credible counterfactual with pair and exporter/importer-time effects", main_threat: "sanctions targeting and trade diversion"}
  - {id: H14, title: "Digital payments and informal economy", outcome: "documented shadow-economy estimate or formalization proxy", exposure: "digital payments adoption", frequency: "annual", methods: ["panel FE", "DiD if defensible"], sources: ["World Bank Global Findex", "IMF", "national statistics"], identification: "credible rollout natural experiment", main_threat: "noisy shadow-economy measurement"}
  - {id: H15, title: "De-dollarization and USD reserve share", outcome: "USD share of allocated official reserves", exposure: "non-USD settlement/reserve diversification measure", frequency: "quarterly/annual", methods: ["time-series regression", "cointegration/ECM if supported"], sources: ["IMF COFER", "BIS", "central-bank reports"], identification: "aggregate time-series; causal claims require exogenous variation", main_threat: "valuation effects, limited sample and structural breaks"}
  - {id: H16, title: "Infrastructure and productivity", outcome: "TFP growth", exposure: "infrastructure investment/quality", frequency: "annual", methods: ["panel FE", "local projections"], sources: ["IMF", "WDI", "Penn World Table", "budget records"], identification: "credible allocation rule, natural experiment or valid instrument", main_threat: "investment responds to productivity and political priorities"}
  - {id: H17, title: "Cybersecurity spending and losses", outcome: "incident count/severity or monetary loss", exposure: "lagged cybersecurity spending/headcount", frequency: "firm-year", methods: ["firm FE", "Poisson/negative binomial", "event study"], sources: ["public filings", "regulator disclosures", "VERIS", "lawful insurance data"], identification: "credible regulation or other exogenous exposure if causal", main_threat: "reporting bias and reverse causality"}
  - {id: H18, title: "Board interlocks and concentration", outcome: "HHI or alternative concentration measure", exposure: "interlock/network metric", frequency: "industry-year", methods: ["panel FE", "network analysis", "event study"], sources: ["SEC proxy statements", "market shares", "licensed board data"], identification: "credible governance shock; proposed instruments require scrutiny", main_threat: "concentration may cause interlocks"}
  - {id: H19, title: "Carbon pricing and industrial output", outcome: "sector output/employment/productivity", exposure: "carbon price multiplied by pre-policy emissions exposure", frequency: "sector-year", methods: ["DiD/event study", "modern staggered-treatment estimator"], sources: ["OECD", "national policy records", "industrial production data"], identification: "credible control group, pre-trends and treatment timing", main_threat: "policy selection, exemptions and production leakage"}
  - {id: H20, title: "SWF activity and market stability", outcome: "realized volatility, liquidity or spreads", exposure: "documented SWF transactions/market exposure", frequency: "event/daily/monthly", methods: ["event study", "panel FE"], sources: ["SWF disclosures", "national reports", "BIS", "market data"], identification: "transaction or mandate event with credible counterfactual", main_threat: "SWFs trade endogenously during stress"}
