version: "1.0"
purpose: "Global stock-exchange, financial-regulatory, trade, banking, and industry-sector source registry"
design_principles:
  - preserve_source_variables: true
  - lineage_required: true
  - official_first: true
  - country_institution_mapping: true
  - source_faithful_bronze: true
  - standardized_silver: true
  - analytical_gold: true

international_benchmark_sources:
  - id: wfe
    organization: World Federation of Exchanges
    domains: [stock_exchanges, market_structure, equities, derivatives, etfs, ipos, liquidity]
    outputs: [listed_companies, market_capitalization, trading_value, trading_volume, derivatives_activity, listings, liquidity]
    frequency: monthly_and_annual
    authority_level: international_industry_association
  - id: bis
    organization: Bank for International Settlements
    domains: [banking, credit, debt_securities, derivatives, property, payments, exchange_rates, central_banks]
    outputs: [locational_banking, consolidated_banking, debt_securities, credit_to_nonfinancial_sector, debt_service_ratios, derivatives, property_prices, central_bank_assets, policy_rates]
    frequency: quarterly_or_as_defined
    authority_level: international_standard_source
  - id: iosco
    organization: International Organization of Securities Commissions
    domains: [securities_regulation, market_supervision, conduct, disclosure]
    outputs: [regulatory_frameworks, supervisory_information, jurisdictional_membership]
    frequency: as_published
    authority_level: international_standard_setter
  - id: bcbs
    organization: Basel Committee on Banking Supervision
    domains: [banking_supervision, capital, liquidity, risk]
    outputs: [basel_framework, capital_monitoring, liquidity_monitoring, supervisory_frameworks]
    frequency: as_published
    authority_level: international_standard_setter
  - id: wto
    organization: World Trade Organization
    domains: [imports, exports, tariffs, services, trade_policy]
    outputs: [merchandise_trade, services_trade, tariffs, trade_by_product, trade_by_partner]
    frequency: monthly_quarterly_annual
    authority_level: international_intergovernmental
  - id: un_comtrade
    organization: United Nations Statistics Division
    dataset: UN Comtrade
    domains: [imports, exports, commodities, products]
    outputs: [reporter_partner_trade, hs_sitc_trade, trade_value, quantity]
    frequency: monthly_annual
    authority_level: international_intergovernmental
  - id: unctadstat
    organization: UN Trade and Development
    domains: [trade, investment, shipping, productive_capacity, commodities]
    outputs: [fdi, trade, maritime_transport, commodity_indicators]
    frequency: mixed
    authority_level: international_intergovernmental
  - id: imf
    organization: International Monetary Fund
    domains: [macro, balance_of_payments, exchange_rates, fiscal, financial_accounts]
    outputs: [bop, international_investment_position, exchange_rates, monetary_data, fiscal_data]
    frequency: mixed
    authority_level: international_intergovernmental
  - id: world_bank
    organization: World Bank
    domains: [macro, development, industry, trade, finance]
    outputs: [wdi, financial_inclusion, enterprise_indicators, development_indicators]
    frequency: annual_or_mixed
    authority_level: international_intergovernmental
  - id: oecd
    organization: OECD
    domains: [macro, industry, productivity, trade, finance, corporate_governance]
    outputs: [national_accounts, industry_statistics, productivity, trade, corporate_governance]
    frequency: mixed
    authority_level: international_intergovernmental

jurisdiction_source_model:
  required_roles:
    exchange: [equities, bonds, etfs, derivatives, listings, trading, market_cap]
    central_bank: [policy_rate, balance_sheet, monetary, payments, exchange_rates, banking_statistics]
    banking_supervisor: [capital, liquidity, asset_quality, deposits, loans, bank_failures, prudential_actions]
    securities_regulator: [issuers, offerings, disclosures, enforcement, market_integrity, funds]
    trade_authority: [imports, exports, tariffs, customs, trade_by_product, trade_by_partner]
    statistics_office: [gdp, industry, labor, prices, production, business_demography]
    sector_agencies: [energy, agriculture, mining, manufacturing, transport, telecom, health, construction]
    tax_or_finance_ministry: [fiscal, public_debt, revenue, budget, government_finance]

