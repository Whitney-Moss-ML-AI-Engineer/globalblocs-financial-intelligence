sector_data_model:
  global_classifications: [ISIC, NAICS, NACE, GICS, HS, SITC, CPC]
  required_sector_dimensions:
    - sector_code
    - sector_name
    - classification_system
    - country
    - period
    - production
    - revenue_or_output
    - employment
    - wages
    - productivity
    - imports
    - exports
    - investment
    - capacity
    - prices
    - energy_use
    - business_count
    - insolvencies
    - credit_exposure
  priority_sectors:
    - banking_and_finance
    - insurance
    - energy_oil_gas
    - mining
    - manufacturing
    - semiconductors
    - technology
    - telecommunications
    - transportation
    - logistics
    - agriculture
    - food
    - pharmaceuticals
    - healthcare
    - construction
    - real_estate
    - automotive
    - aerospace_defense
    - chemicals
    - utilities
    - retail
    - tourism
    - professional_services

market_data_model:
  exchange_fields:
    - exchange_id
    - country
    - market_segment
    - security_id
    - ticker
    - isin
    - issuer
    - sector
    - classification
    - listing_date
    - currency
    - price
    - volume
    - turnover
    - market_cap
    - bid_ask_spread
    - volatility
    - corporate_action
    - trading_status
    - source_timestamp
  derivatives_fields:
    - contract_id
    - underlying
    - contract_type
    - expiry
    - strike
    - open_interest
    - volume
    - settlement_price
    - implied_volatility
    - margin
    - clearing_house

regulatory_event_model:
  event_types:
    - enforcement
    - supervisory_action
    - bank_failure
    - license_action
    - issuer_filing
    - market_halt
    - disclosure
    - capital_action
    - sanctions
    - tariff_action
    - customs_action
    - merger
    - acquisition
  fields:
    - jurisdiction
    - regulator
    - entity
    - event_type
    - event_date
    - effective_date
    - severity
    - legal_reference
    - source_url
    - source_document
    - extracted_text
    - extraction_method

ingestion_strategy:
  tier_1:
    description: "Official machine-readable APIs and bulk downloads"
    examples: [central_banks, statistics_offices, customs_trade_apis, regulator_apis]
  tier_2:
    description: "Official CSV/XLSX/SDMX/PDF publications"
    examples: [regulatory_reports, annual_reports, sector_bulletins]
  tier_3:
    description: "Exchange feeds and licensed market-data interfaces"
    examples: [exchange_market_data, derivatives, order_book_data]
  tier_4:
    description: "International aggregators used for cross-country validation"
    examples: [BIS, IMF, World Bank, OECD, WTO, WFE]
